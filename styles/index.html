<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
  <title>主页风格预览 · Hengchao</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eceeea;color:#26302a;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #536c52;outline-offset:4px}.top{background:#fafbf8;border-bottom:1px solid #d9ded5;padding:19px 30px 0}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:21px}.identity{display:flex;align-items:center;gap:13px}.mark{width:33px;height:33px;background:#243b2b;border-radius:9px;display:grid;place-items:center;color:#f9faf7;font:italic 24px Georgia,serif}.heading h1{font-size:15px;letter-spacing:-.3px;margin:0;font-weight:600}.heading p{font-size:11px;color:#858d80;margin:2px 0 0}.back{font-size:11px;color:#64725e}.controls{display:flex;justify-content:space-between;align-items:end;gap:25px}.themes{display:flex;gap:6px}.theme{position:relative;display:flex;gap:9px;align-items:center;border:0;background:none;padding:13px 17px 17px;color:#7b8277;font-size:12px;white-space:nowrap}.theme[aria-pressed=true]{color:#243b2b;font-weight:600}.theme[aria-pressed=true]:after{content:"";position:absolute;bottom:-1px;left:16px;right:16px;height:3px;background:#243b2b}.swatch{display:block;width:14px;height:14px;border:1px solid #0001;border-radius:50%;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}.tools{display:flex;align-items:center;gap:16px;padding-bottom:13px}.devices{display:flex;background:#edf0e9;padding:3px;border-radius:7px;gap:2px}.device{border:0;background:none;border-radius:5px;display:grid;place-items:center;width:31px;height:28px;color:#808978}.device[aria-pressed=true]{background:white;box-shadow:0 1px 4px #23352214;color:#2e482e}.device svg{width:16px;height:16px}.open{font-size:11px;white-space:nowrap}.info{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1500px;margin:auto;padding:16px 30px;color:#76816f;font-size:11px}.info b{font-weight:500;color:#40533a}.info .index{font:10px monospace;letter-spacing:1px}.stage{padding:0 24px 24px;display:flex;justify-content:center;height:calc(100dvh - 182px);min-height:440px}.frame{width:100%;height:100%;border:1px solid #d6dcd0;border-radius:10px;background:white;overflow:hidden;box-shadow:0 12px 35px #243b2b09;transition:width .25s}.frame.mobile{width:390px;border:7px solid #253128;border-radius:29px;box-shadow:0 15px 45px #243b2b21}iframe{display:block;border:0;width:100%;height:100%;background:#f7f5ef}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.top{padding:15px 18px 0}.heading{margin-bottom:10px}.heading p{font-size:10px}.controls{align-items:center;gap:10px;flex-wrap:wrap}.themes{width:100%;justify-content:space-between;gap:0}.theme{padding:11px 3px 14px;gap:6px;font-size:11px}.theme[aria-pressed=true]:after{left:2px;right:2px}.tools{width:100%;justify-content:space-between;padding:10px 0}.devices{display:none}.open{margin-left:auto}.info{padding:12px 19px;font-size:10px}.info .index{display:none}.stage{padding:0 10px 10px;height:calc(100dvh - 206px);min-height:400px}.frame{border-radius:8px}.back{font-size:10px}.heading h1{font-size:14px}.frame.mobile{width:100%;border:1px solid #d6dcd0;border-radius:8px}}@media(prefers-reduced-motion:reduce){.frame{transition:none}}
  </style>
</head>
<body>
  <header class="top"><div class="heading"><div class="identity"><div class="mark">h</div><div><h1>给主页，换一种表达。</h1><p>HENGCHAO / DESIGN EXPLORATIONS</p></div></div><a class="back" href="../">返回当前主页 ↗</a></div>
    <div class="controls"><div class="themes" role="group" aria-label="选择主页风格">
      <button class="theme" data-theme="editorial" aria-pressed="true"><span class="swatch" style="--a:#e5dbc9;--b:#b74730"></span>01 纸上手记</button>
      <button class="theme" data-theme="lab" aria-pressed="false"><span class="swatch" style="--a:#182019;--b:#c4ed75"></span>02 技术实验室</button>
      <button class="theme" data-theme="studio" aria-pressed="false"><span class="swatch" style="--a:#dce7fd;--b:#315ded"></span>03 蓝白工作室</button>
      <button class="theme" data-theme="original" aria-pressed="false"><span class="swatch" style="--a:#eceee1;--b:#596e45"></span>原版</button>
    </div><div class="tools"><div class="devices" role="group" aria-label="预览设备"><button class="device" data-device="desktop" aria-pressed="true" aria-label="桌面预览" title="桌面预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button><button class="device" data-device="mobile" aria-pressed="false" aria-label="手机预览" title="手机预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg></button></div><a class="open" id="open" href="editorial.html" target="_blank" rel="noopener">独立打开 ↗</a></div></div>
  </header>
  <div class="info"><span id="description" aria-live="polite"><b>纸上手记</b>　衬线字体 / 米白纸感 / 编辑式排版</span><span class="index">01 — 03 / SELECT A DIRECTION</span></div>
  <main class="stage"><div class="frame" id="frame"><iframe id="preview" src="editorial.html" title="纸上手记风格预览"></iframe></div></main>
  <script>
    const themes={editorial:{name:'纸上手记',description:'衬线字体 / 米白纸感 / 编辑式排版',url:'editorial.html'},lab:{name:'技术实验室',description:'深色网格 / 荧光绿 / 技术笔记与实验',url:'lab.html'},studio:{name:'蓝白工作室',description:'明亮蓝白 / 抽象图形 / 卡片式笔记',url:'studio.html'},original:{name:'当前原版',description:'暖白与橄榄绿 / 阅读与生活 / 温柔插画',url:'../index.html'}};
    function selectTheme(key){if(!themes[key])key='editorial';const theme=themes[key];document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===key)));const preview=document.querySelector('#preview');preview.src=theme.url;preview.title=theme.name+'风格预览';document.querySelector('#open').href=theme.url;document.querySelector('#description').innerHTML=`<b>${theme.name}</b>　${theme.description}`;history.replaceState(null,'','#'+key);}
    document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>selectTheme(b.dataset.theme)));
    document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#frame').classList.toggle('mobile',b.dataset.device==='mobile');document.querySelectorAll('[data-device]').forEach(d=>d.setAttribute('aria-pressed',String(d===b)));}));
    if(location.hash)selectTheme(location.hash.slice(1));
  </script>
</body>
</html>
